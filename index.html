<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂 10 題即時互動測驗系統</title>
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
        body { margin: 0; padding: 16px; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: var(--card); padding: 28px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        .hidden { display: none !important; }
        
        /* 警告橫幅 */
        .alert-banner { background: #fef2f2; border: 2px solid #ef4444; color: #991b1b; padding: 16px; border-radius: 12px; margin-bottom: 20px; line-height: 1.5; }
        .alert-banner a { color: #b91c1c; font-weight: bold; }

        /* 按鈕樣式 */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); }
        .btn-warning:hover { background: #b45309; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        .btn-sm { padding: 8px 14px; font-size: 14px; }

        /* 講師出題列表 */
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; }
        .q-card { border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; margin-bottom: 16px; background: #f8fafc; }
        .q-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: var(--primary); }
        input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        input[type="text"]:focus, textarea:focus { border-color: var(--primary); outline: none; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        @media (max-width: 640px) { .options-grid { grid-template-columns: 1fr; } }
        .opt-row { display: flex; align-items: center; gap: 8px; background: white; padding: 6px 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .opt-label { font-weight: bold; color: var(--muted); width: 24px; }

        /* 講師即時投影區 */
        .live-topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: #f8fafc; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge-live { background: #dcfce7; color: #166534; }
        .badge-locked { background: #fef3c7; color: #92400e; }
        .dashboard { display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start; }
        @media (max-width: 800px) { .dashboard { grid-template-columns: 1fr; } }
        .qr-box { background: #f8fafc; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        #qrcode { display: flex; justify-content: center; margin: 12px auto; background: white; padding: 12px; border-radius: 10px; width: fit-content; cursor: zoom-in; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        /* 長條圖與統計 */
        .q-title-display { font-size: 26px; font-weight: bold; margin: 0 0 20px 0; line-height: 1.4; }
        .bar-item { margin-bottom: 18px; }
        .bar-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px; font-size: 18px; }
        .bar-bg { width: 100%; height: 40px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }
        .bar-fill.correct { background: var(--success) !important; }
        .bar-fill.dimmed { background: #94a3b8 !important; }
        .summary-box { margin-top: 20px; padding: 16px; border-radius: 10px; background: #eff6ff; border: 1px solid #bfdbfe; font-size: 18px; font-weight: bold; color: #1e40af; }

        /* 學生手機介面 */
        .student-wrap { max-width: 520px; margin: 0 auto; }
        .student-opt-btn { width: 100%; padding: 16px; margin-bottom: 12px; font-size: 17px; font-weight: bold; background: white; border: 2px solid #cbd5e1; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.15s; display: flex; align-items: center; gap: 10px; }
        .student-opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
        .student-opt-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .student-opt-btn:disabled { cursor: default; opacity: 0.85; }
        .student-mini-bar { margin-top: 20px; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }

        /* 放大 QR Code 彈窗 */
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.8); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; text-align: center; max-width: 95%; }
    </style>
</head>
<body>

<div class="container">
    <!-- 本機檔案開啟警告 -->
    <div id="local-warning" class="alert-banner hidden">
        ⚠️ <strong>偵測到您正從電腦本機硬碟（file://）開啟此網頁！</strong><br>
        學生手機掃描 QR Code 將無法連上您的電腦。請將此檔案上傳至 <strong>GitHub Pages</strong> 或拖曳至 <a href="https://netlify.com" target="_blank">Netlify Drop</a> 取得公開網址後再使用。
    </div>

    <!-- 1. 講師出題設定區 -->
    <div id="host-setup">
        <div class="header-bar">
            <div>
                <h1 style="margin:0;">📚 課堂 10 題即時測驗設定</h1>
                <p style="margin:6px 0 0 0; color: var(--muted);">設定每題 A、B、C、D 選項並勾選正確答案（可依實際需求增減題數）</p>
            </div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-secondary btn-sm" onclick="toggleBatchImport()">📋 批次匯入題目</button>
                <button class="btn btn-success" onclick="startSession()">🚀 開始課堂測驗</button>
            </div>
        </div>

        <!-- 批次匯入區塊 -->
        <div id="batch-box" class="hidden" style="background:#f8fafc; padding:16px; border-radius:12px; margin-bottom:20px; border:1px solid #cbd5e1;">
            <p style="margin-top:0; font-weight:bold;">批次貼上格式說明（每行一題，以直線符號 <code>|</code> 分隔：題目|選項A|選項B|選項C|選項D|正解代號A~D）：</p>
            <textarea id="batch-text" rows="5" placeholder="HTML的全稱是什麼？|超文本標記語言|高階程式語言|家庭工具語言|超連結傳輸協定|A"></textarea>
            <div style="margin-top:10px; display:flex; gap:8px;">
                <button class="btn btn-sm" onclick="applyBatchImport()">套用匯入</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleBatchImport()">取消</button>
            </div>
        </div>

        <div id="questions-list"></div>

        <div style="margin-top: 20px; display: flex; justify-content: space-between;">
            <button class="btn btn-secondary" onclick="addQuestionCard()">➕ 新增一題</button>
            <button class="btn btn-success" onclick="startSession()">🚀 開始課堂測驗</button>
        </div>
    </div>

    <!-- 2. 講師即時投影區 -->
    <div id="host-live" class="hidden">
        <div class="live-topbar">
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="conn-badge" class="badge badge-live">🟢 連線建立中...</span>
                <span style="font-weight:bold; font-size:18px;">第 <span id="current-q-num">1</span> / <span id="total-q-num">10</span> 題</span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="btn-reveal" class="btn btn-warning" onclick="revealAnswer()">🔒 結束投票並公布正解</button>
                <button id="btn-next" class="btn btn-success hidden" onclick="nextQuestion()">➡️ 講解完畢，進入下一題</button>
                <button class="btn btn-secondary btn-sm" onclick="backToSetup()">⚙️ 返回題庫</button>
            </div>
        </div>

        <div class="dashboard">
            <div class="qr-box">
                <div style="font-weight:bold; font-size:16px;">📱 手機掃碼加入測驗</div>
                <div id="qrcode" title="點擊放大 QR Code" onclick="openQrModal()"></div>
                <button class="btn btn-secondary btn-sm" style="width:100%; justify-content:center; margin-bottom:10px;" onclick="copyJoinUrl()">🔗 複製學生連線網址</button>
                <div style="font-size:14px; color:var(--muted);">已連線學生：<strong id="student-count">0</strong> 人</div>
                <div style="font-size:18px; font-weight:bold; color:var(--primary); margin-top:6px;">
                    本題已投票：<span id="live-vote-count">0</span> 人
                </div>
            </div>

            <div>
                <div id="live-q-title" class="q-title-display"></div>
                <div id="live-bars"></div>
                <div id="answer-summary" class="summary-box hidden"></div>
            </div>
        </div>
